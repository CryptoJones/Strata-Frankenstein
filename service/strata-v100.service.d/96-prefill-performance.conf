# Use the measured V100 prompt performance profile.
# Keep the logical context capacity and INT8 KV format unchanged.
[Service]
Environment=STRATA_PF_WMMA=1
Environment=STRATA_PF_SKIP_UNROUTED=1
Environment=STRATA_KV_GROW=1
Environment=STRATA_CKPT_POOL=1
Environment=STRATA_CKPT_THREADS=1
Environment=STRATA_DEQUANT_WIDE=1
Environment=STRATA_PREFILL_PROMOTE=2048
# Measured on the two-V100 split; both options remain opt-in in the engine.
Environment=STRATA_SPLIT_MTP_BATCH=1
# FP32 tiled QSA scoring: faster long reads, different score summation order.
Environment=STRATA_SELECT_SIMT=1
